<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radio Havokk</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Hls.js Stable Library Engine -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <!-- Lucide Icons for Professional UI -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- PWA Web Manifest Configuration -->
    <link rel="manifest" href='data:application/json,{"name":"RadioHavokk","short_name":"RadioHavokk","description":"All India Radio Fallback Grid Engine","start_url":".","display":"standalone","background_color":"#000000","theme_color":"#10b981","orientation":"portrait","icons":[{"src":"data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📻</text></svg>","sizes":"512x512","type":"image/svg+xml"}]}' />

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-[#09090b] text-zinc-100 min-h-screen flex flex-col font-sans select-none pb-32 sm:pb-28 relative overflow-x-hidden">

    <!-- Background Ambient Gradient Blobs for Glassy Effect -->
    <div class="fixed top-[-10%] left-[-10%] w-[40vw] h-[40vw] bg-emerald-600/20 rounded-full blur-[100px] pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[30vw] h-[30vw] bg-blue-600/10 rounded-full blur-[100px] pointer-events-none z-0"></div>

    <!-- Glassy Navbar Layout Header -->
    <header class="border-b border-white/5 bg-black/40 backdrop-blur-xl sticky top-0 z-50 px-4 py-3 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 relative z-10">
            <div class="flex items-center justify-between w-full sm:w-auto">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-emerald-500 to-emerald-700 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/20 shrink-0">
                        <i data-lucide="radio" class="w-5 h-5 text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                            Radio Havokk
                            <span class="text-[10px] bg-white/10 text-zinc-300 border border-white/10 px-2 py-0.5 rounded-full font-mono uppercase tracking-wider">V2.0</span>
                        </h1>
                        <p class="text-xs text-zinc-400 hidden sm:block">All India Radio Fallback Grid Engine</p>
                    </div>
                </div>
                <!-- PWA Install Button (Hidden by default, shown via JS if supported) -->
                <button id="pwaInstallBtn" class="hidden sm:hidden bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 rounded-lg text-xs font-bold items-center gap-1.5 transition-all active:scale-95">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i> Install
                </button>
            </div>

            <div class="flex items-center gap-3 w-full sm:w-auto">
                <button id="desktopInstallBtn" class="hidden md:flex bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 px-3 py-2 rounded-lg text-xs font-bold items-center gap-1.5 transition-all hover:bg-emerald-600/40">
                    <i data-lucide="download" class="w-4 h-4"></i> Install App
                </button>
                <!-- Modern Search Inputs Bar -->
                <div class="relative w-full sm:w-80 transition-all group">
                    <input type="text" id="globalSearch" placeholder="Search stations, tags..."
                        class="w-full bg-white/5 border border-white/10 rounded-full pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-emerald-500/50 focus:bg-white/10 text-zinc-200 transition-all placeholder:text-zinc-500 shadow-inner">
                    <i data-lucide="search" class="absolute left-3.5 top-2.5 w-4 h-4 text-zinc-500 group-focus-within:text-emerald-400 transition-colors"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- Content Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col gap-6 relative z-10">

        <!-- Filter Tabs Wrapper -->
        <div class="flex items-center gap-2 overflow-x-auto pb-2 custom-scrollbar sticky top-0" id="tabFilterLayout">
            <button class="filter-tab active-filter-tab px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all border border-white/10 bg-white text-black shadow-md flex items-center gap-2" data-target="all">
                All Stations
            </button>
            <button class="filter-tab inactive-filter-tab px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all border border-white/10 bg-white/5 text-zinc-400 hover:bg-white/10 hover:text-white flex items-center gap-2" data-target="favorites">
                <i data-lucide="heart" class="w-4 h-4"></i> Favorites
            </button>
            <button class="filter-tab inactive-filter-tab px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all border border-white/10 bg-white/5 text-zinc-400 hover:bg-white/10 hover:text-white" data-target="Akashvani">Akashvani</button>
            <button class="filter-tab inactive-filter-tab px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all border border-white/10 bg-white/5 text-zinc-400 hover:bg-white/10 hover:text-white" data-target="Marathi">Marathi</button>
            <button class="filter-tab inactive-filter-tab px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all border border-white/10 bg-white/5 text-zinc-400 hover:bg-white/10 hover:text-white" data-target="Bollywood">Bollywood</button>
            <button class="filter-tab inactive-filter-tab px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all border border-white/10 bg-white/5 text-zinc-400 hover:bg-white/10 hover:text-white" data-target="Retro">Retro</button>
            <button class="filter-tab inactive-filter-tab px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all border border-white/10 bg-white/5 text-zinc-400 hover:bg-white/10 hover:text-white" data-target="90s">90s</button>
            <button class="filter-tab inactive-filter-tab px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all border border-white/10 bg-white/5 text-zinc-400 hover:bg-white/10 hover:text-white" data-target="00s">00s</button>
            <button class="filter-tab inactive-filter-tab px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all border border-white/10 bg-white/5 text-zinc-400 hover:bg-white/10 hover:text-white" data-target="Modern">Modern</button>
        </div>

        <!-- Dynamic Content Response Area Grid -->
        <div id="cardsLayoutGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4">
            <!-- Render cards via js layout -->
        </div>
    </main>

    <!-- Universal Sticky Bottom Control Dock -->
    <div class="fixed bottom-0 left-0 right-0 bg-black/80 border-t border-white/10 px-3 sm:px-4 py-3 z-50 backdrop-blur-2xl shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-4">

            <!-- Mobile Layout Row 1: Now Playing + Play Button -->
            <div class="flex items-center justify-between w-full sm:w-1/3">
                <div class="flex items-center gap-3 w-[70%] sm:w-full">
                    <div id="playingWaveIcon" class="w-10 h-10 sm:w-12 sm:h-12 bg-white/5 border border-white/10 rounded-xl flex items-center justify-center text-zinc-500 shadow-md transition-all shrink-0">
                        <i data-lucide="music" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                    </div>
                    <div class="overflow-hidden">
                        <h4 id="footerTitle" class="font-bold text-sm text-zinc-100 truncate">No Active Station</h4>
                        <p id="footerSubtitle" class="text-xs text-zinc-400 truncate mt-0.5">Select a station to play</p>
                    </div>
                </div>
                
                <!-- Play Button on Mobile (Moved next to title) -->
                <button id="mobilePlayPauseBtn" class="sm:hidden bg-white active:bg-zinc-200 text-black p-2.5 rounded-full transition-transform active:scale-95 shadow-[0_0_15px_rgba(255,255,255,0.2)] flex items-center justify-center w-10 h-10 shrink-0">
                    <i data-lucide="play" class="w-4 h-4 ml-0.5" id="mobileDockPlayIcon"></i>
                </button>
            </div>

            <!-- Central Controls (Desktop Only) -->
            <div class="hidden sm:flex items-center justify-center gap-4 w-full sm:w-1/3">
                <button id="bottomPlayPauseBtn" class="bg-white hover:bg-zinc-200 text-black p-3 rounded-full transition-transform hover:scale-105 shadow-[0_0_15px_rgba(255,255,255,0.3)] flex items-center justify-center w-12 h-12">
                    <i data-lucide="play" class="w-5 h-5 ml-1" id="dockPlayIcon"></i>
                </button>
            </div>

            <!-- Audio Controls: EQ & Volume -->
            <div class="flex items-center justify-between sm:justify-end w-full sm:w-1/3 gap-3">
                
                <!-- EQ/Bass Boost Toggle -->
                <button id="eqToggleBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-xs text-zinc-400 hover:text-emerald-400 hover:border-emerald-500/50 transition-all" title="Toggle Bass Boost & Spatial Audio">
                    <i data-lucide="audio-lines" class="w-3.5 h-3.5"></i>
                    <span id="eqStatusText">HQ Off</span>
                </button>

                <!-- Volume Slider -->
                <div class="flex items-center gap-2">
                    <i data-lucide="volume-2" class="w-4 h-4 text-zinc-400 hidden sm:block"></i>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1"
                        class="w-full sm:w-32 accent-white h-1.5 bg-white/10 rounded-full cursor-pointer hover:accent-emerald-400 transition-all appearance-none outline-none">
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Native Audio Node Container Interface -->
    <audio id="audioStreamingEngine" class="hidden" crossorigin="anonymous"></audio>

    <!-- Core Interactive Client Logic JS -->
    <script src="script.js"></script>
    
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
